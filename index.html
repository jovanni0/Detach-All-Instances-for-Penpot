<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Detach All Instances</title>
    <style>
        :root 
        {
            color-scheme: light dark;
        }

        body 
        {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        p 
        {
            margin: 0;
            font-size: 13px;
            opacity: 0.8;
            line-height: 1.4;
        }

        button 
        {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid rgba(127, 127, 127, 0.4);
            cursor: pointer;
            background: rgba(127, 127, 127, 0.08);

            &:hover 
            {
                background: rgba(127, 127, 127, 0.18);
            }
        }

        #status 
        {
            font-size: 12px;
            min-height: 16px;
        }
    </style>
</head>

<body>
    <p>
        Select one or more boards (or any shapes) on the canvas, then run this to recursively detach every component
        instance found inside them, including nested instances.
    </p>
    <button id="run">Detach everithing in selection</button>
    <div id="status"></div>

    <script>
        const button = document.getElementById("run")
        const status = document.getElementById("status")

        button.addEventListener("click", () => 
        {
            status.textContent = "Working…"
            button.disabled = true
            parent.postMessage({ type: "run-detach" }, "*")
        })

        window.addEventListener("message", (event) => 
        {
            const data = event.data

            if (data && data.type === "result") 
            {
                status.textContent = data.message
                button.disabled = false
            }
        })
    </script>
</body>

</html>
